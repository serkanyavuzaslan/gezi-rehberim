<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gezi Rehberim - Kayıt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #e65100;
            --hover-color: #ff7d26;
            --bg-light: #fff5eb;
            --text-color: #333;
            --border-radius: 12px;
            --box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background: url('https://images.unsplash.com/photo-1506477331477-33d5d8b3dc85?q=80&w=2574') center/cover no-repeat fixed;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        /* Header Stil */
        .header {
            padding: 1.2rem 5%;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            background-color: rgba(255, 255, 255, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo h2 {
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: var(--border-radius);
        }

        .home-link:hover {
            color: var(--primary-color);
            background-color: var(--bg-light);
        }

        /* Ana Kapsayıcı */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Sayfa Başlığı */
        .page-title {
            text-align: center;
            margin: 40px 0 20px;
            max-width: 800px;
        }

        .page-title h1 {
            color: var(--primary-color);
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            font-weight: 700;
        }

        .page-title p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 550px;
            margin: 30px auto 60px;
            padding: 40px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            text-align: center;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--hover-color));
        }

        .auth-image {
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
            display: inline-block;
        }

        .auth-image img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 5px 15px rgba(230, 81, 0, 0.2));
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .auth-title {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .auth-title h2 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-title p {
            color: #777;
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .auth-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--hover-color));
            margin: 8px auto 0;
            border-radius: 3px;
        }

        /* Form Grupları */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 14px;
            transition: var(--transition);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            border: 2px solid #ebebeb;
            border-radius: var(--border-radius);
            font-size: 15px;
            color: var(--text-color);
            transition: var(--transition);
            box-sizing: border-box;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--hover-color);
            box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.1);
        }

        .form-group:focus-within label {
            color: var(--hover-color);
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 47px;
            color: #aaa;
            transition: var(--transition);
        }

        .form-group:focus-within i {
            color: var(--primary-color);
        }

        /* İki Sütunlu Düzen */
        .two-column {
            display: flex;
            gap: 20px;
        }

        .two-column .form-group {
            flex: 1;
        }

        /* Buton */
        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--hover-color));
            color: white !important;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 6px 15px rgba(230, 81, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            opacity: 1 !important;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transition: all 0.4s ease;
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(230, 81, 0, 0.3);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        /* Auth Footer */
        .auth-footer {
            text-align: center;
            margin-top: 35px;
            color: #666;
            font-size: 15px;
            position: relative;
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            width: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.1), transparent);
        }

        .auth-footer span {
            color: #666;
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            display: inline-block;
            margin-left: 8px;
            padding: 10px 18px;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            background-color: rgba(230, 81, 0, 0.05);
            box-shadow: 0 2px 8px rgba(230, 81, 0, 0.1);
        }

        .auth-footer a:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.2);
        }

        /* Hata Mesajları */
        .error-message {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            animation: shake 0.5s ease;
            padding-left: 5px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title h1 {
                font-size: 2.2rem;
            }
            
            .auth-container {
                padding: 30px 25px;
                margin: 20px 20px 40px;
            }
            
            .auth-title h2 {
                font-size: 1.8rem;
            }
            
            .two-column {
                flex-direction: column;
                gap: 0;
            }
        }
        
        @media (max-width: 480px) {
            .page-title h1 {
                font-size: 1.8rem;
            }
            
            .page-title p {
                font-size: 0.95rem;
            }
            
            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <h2>gezi rehberim</h2>
        </div>
        <div class="header-right">
            <a href="index.html" class="home-link">
                <i class="fas fa-home"></i> Anasayfa
            </a>
        </div>
    </header>

    <div class="container">
        <div class="page-title">
            <h1>Gezi Dünyasına Katılın</h1>
            <p>Türkiye'nin en güzel yerlerini keşfedin, deneyimlerinizi kaydedin ve başkalarıyla paylaşın.</p>
        </div>

        <div class="auth-container">
            <div class="auth-image">
                <img src="https://img.icons8.com/color/96/000000/passport.png" alt="Gezi Rehberi">
            </div>
            <div class="auth-title">
                <h2>Kayıt Ol</h2>
                <p>Hemen ücretsiz hesap oluşturun ve keşfe başlayın</p>
            </div>
            
            <form id="registerForm">
                <div class="two-column">
                    <div class="form-group">
                        <label for="firstName">Ad</label>
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstName" name="firstName" placeholder="Adınız" required>
                        <div class="error-message" id="firstName-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Soyad</label>
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastName" name="lastName" placeholder="Soyadınız" required>
                        <div class="error-message" id="lastName-error"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <i class="fas fa-id-badge"></i>
                    <input type="text" id="username" name="username" placeholder="Kullanıcı adınız" required>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">E-posta</label>
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="E-posta adresiniz" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Şifreniz" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Şifre Tekrar</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Şifrenizi tekrar girin" required>
                    <div class="error-message" id="confirmPassword-error"></div>
                </div>
                
                <button type="submit" class="auth-btn" style="opacity: 1 !important; visibility: visible !important;">
                    <i class="fas fa-user-plus"></i> Hesap Oluştur
                </button>
                
                <div class="auth-footer">
                    <span>Zaten hesabınız var mı?</span>
                    <a href="login.html"><i class="fas fa-sign-in-alt"></i> Giriş Yap</a>
                </div>
            </form>
        </div>
    </div>

    <!-- GSAP Animasyon -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // GSAP Animasyonları
            gsap.from(".logo", {duration: 1, y: -50, opacity: 0, ease: "power3.out"});
            gsap.from(".page-title", {duration: 1, opacity: 0, y: 30, delay: 0.3, ease: "power3.out"});
            gsap.from(".auth-container", {duration: 1, opacity: 0, y: 50, delay: 0.5, ease: "power3.out"});
            gsap.from(".auth-image", {duration: 1, opacity: 0, scale: 0.5, delay: 0.7, ease: "power3.out"});
            gsap.from(".form-group", {duration: 0.8, opacity: 0, y: 20, stagger: 0.15, delay: 0.9, ease: "power3.out"});
            
            // Buton animasyonunu düzeltme - to kullanarak kesinlikle görünür olmasını sağla
            gsap.to(".auth-btn", {duration: 0.8, opacity: 1, y: 0, delay: 0.5, ease: "power3.out"});
            
            gsap.from(".auth-footer", {duration: 0.8, opacity: 0, delay: 1.9, ease: "power3.out"});

            const registerForm = document.getElementById('registerForm');
            
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Hata mesajlarını temizle
                document.querySelectorAll('.error-message').forEach(el => {
                    el.style.display = 'none';
                    el.textContent = '';
                });
                
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Basit doğrulama
                let isValid = true;
                
                if (!firstName) {
                    showError('firstName-error', 'Ad gereklidir');
                    isValid = false;
                }
                
                if (!lastName) {
                    showError('lastName-error', 'Soyad gereklidir');
                    isValid = false;
                }
                
                if (!username) {
                    showError('username-error', 'Kullanıcı adı gereklidir');
                    isValid = false;
                }
                
                if (!email) {
                    showError('email-error', 'E-posta gereklidir');
                    isValid = false;
                } else if (!isValidEmail(email)) {
                    showError('email-error', 'Geçerli bir e-posta adresi girin');
                    isValid = false;
                }
                
                if (!password) {
                    showError('password-error', 'Şifre gereklidir');
                    isValid = false;
                } else if (password.length < 6) {
                    showError('password-error', 'Şifre en az 6 karakter olmalıdır');
                    isValid = false;
                }
                
                if (!confirmPassword) {
                    showError('confirmPassword-error', 'Şifre tekrarı gereklidir');
                    isValid = false;
                } else if (password !== confirmPassword) {
                    showError('confirmPassword-error', 'Şifreler eşleşmiyor');
                    isValid = false;
                }
                
                if (isValid) {
                    try {
                        // Buton metnini değiştir
                        const submitBtn = document.querySelector('.auth-btn');
                        const originalBtnText = submitBtn.innerHTML;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kayıt Oluşturuluyor...';
                        submitBtn.disabled = true;
                        
                        const response = await fetch(`${baseUrl}/api/Auth/register`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                username,
                                email,
                                password,
                                confirmPassword,
                                firstName,
                                lastName
                            })
                        });
                        
                        if (response.ok) {
                            // Başarılı animasyon
                            gsap.to(".auth-container", {
                                duration: 0.5, 
                                scale: 0.95,
                                opacity: 0,
                                onComplete: () => { 
                                    alert('Kayıt başarılı! Giriş yapabilirsiniz.');
                                    window.location.href = 'profile.html'; 
                                }
                            });
                        } else {
                            // Hata durumunda buton metnini geri getir
                            submitBtn.innerHTML = originalBtnText;
                            submitBtn.disabled = false;
                            
                            const errorData = await response.json();
                            alert('Kayıt başarısız: ' + (errorData.message || 'Bir hata oluştu'));
                        }
                    } catch (error) {
                        console.error('Kayıt hatası:', error);
                        alert('Bir hata oluştu. Lütfen daha sonra tekrar deneyin.');
                        
                        // Hata durumunda buton metnini geri getir
                        const submitBtn = document.querySelector('.auth-btn');
                        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Hesap Oluştur';
                        submitBtn.disabled = false;
                    }
                }
            });
            
            function showError(id, message) {
                const errorElement = document.getElementById(id);
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                
                // Hata olan inputun etrafını kırmızı yap
                const input = document.getElementById(id.split('-')[0]);
                input.style.borderColor = '#d32f2f';
                
                // 3 saniye sonra kırmızı kenarlığı kaldır
                setTimeout(() => {
                    input.style.borderColor = '#ebebeb';
                }, 3000);
            }
            
            function isValidEmail(email) {
                const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            }
        });
    </script>
</body>
</html>
