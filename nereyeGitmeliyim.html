<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Testi - Türkiye Şehir Önerisi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #fff3e0;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #ffa726, #fb8c00);
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .question-container {
      display: none;
    }
    .question-container.active {
      display: block;
      background: #fff;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      animation: fadeIn 0.3s ease;
    }
    .question::before {
      content: "🧭 ";
    }
    .question {
      font-size: 1.5rem;
      margin-bottom: 25px;
      color: #e65100;
      text-align: center;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
    }
    .option {
      padding: 14px 18px;
      background-color: #ffe0b2;
      border: 2px solid #ffcc80;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      font-size: 1.1rem;
    }
    .option:hover,
    .option.selected {
      background-color: #ffb74d;
      border-color: #fb8c00;
    }
    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }
    button {
      padding: 10px 24px;
      background-color: #fb8c00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:disabled {
      background-color: #ffcc80;
      cursor: not-allowed;
    }
    .result-container {
      display: none;
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.4s ease;
    }
    .result-container h2 {
      color: #e65100;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .result-container p {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #444;
    }
    .result-container img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 20px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mood Testi</h1>
      <p>Ruh haline göre Türkiye'de seni bekleyen şehri öğren!</p>
    </header>

    <div id="quiz"></div>
    <div class="result-container" id="result">
      <h2>Senin İçin En Uygun Şehir:</h2>
      <p id="city-name" style="font-weight: bold;"></p>
      <p id="city-description"></p>
      <img id="city-img" src="" alt="">
    </div>
    <button id="restart-btn" style="margin-top: 20px; display:none;">Testi Yeniden Başlat</button>
  </div>

  <script>
    const cities = [
      { name: "İstanbul", desc: "Modern yaşamın ve tarihin birleştiği büyülü şehir.", img: "https://cdn.pixabay.com/photo/2018/03/25/16/24/istanbul-3254253_1280.jpg" },
      { name: "İzmir", desc: "Ege’nin incisi; deniz, sanat ve özgür ruh.", img: "https://cdn.pixabay.com/photo/2016/08/15/13/19/izmir-1591753_1280.jpg" },
      { name: "Antalya", desc: "Sıcak plajlar, tarihi kalıntılar ve güneşin kalbi.", img: "https://cdn.pixabay.com/photo/2017/06/20/21/41/beach-2428343_1280.jpg" },
      { name: "Bursa", desc: "Tarihi, doğası ve kış turizmiyle dört dörtlük bir şehir.Uludağ Kayak Merkezinde keyifli bir şekilde kayak yapabilirsiniz.", img: "https://cdn.pixabay.com/photo/2022/02/22/17/01/bursa-7028860_1280.jpg" },
      { name: "Erzurum", desc: "Palandöken’in zirvesinde kayak keyfi ve yöresel tatlar.", img: "https://cdn.pixabay.com/photo/2019/10/29/19/21/erzurum-4588463_1280.jpg" },
      { name: "Trabzon", desc: "Serin yaylalar ve yeşilin bin bir tonu.", img: "https://cdn.pixabay.com/photo/2020/06/13/17/37/lake-5293673_1280.jpg" },
      { name: "Eskişehir", desc: "Genç, enerjik, modern ve bol kahveli bir şehir!", img: "https://cdn.pixabay.com/photo/2018/12/15/19/52/turkey-3876699_1280.jpg" }
    ];

    const questions = [
      { question: "Tatil denince aklınıza ilk olarak hangi mevsim geliyor?", options: ["Yaz gelsin, sıcağı da severim!", "Karlar içinde tatil hayalim!", "Baharda mis gibi çiçek kokuları", "Yaprakların dans ettiği bir sonbahar"] },
      { question: "Gözlerinizi kapatın ve tatilde olduğunuzu hayal edin... Karşınızda nasıl bir manzara canlanıyor?", options: ["Upuzun bir plaj, güneş ve deniz", "Karla kaplı dağlar, kayak pisti", "Canlı sokaklar, bol bol fotoğraflık yer", "Yeşillikler, sis ve serinlik"] },
      { question: "Şöyle bir düşünün... Hangi şehirde yaşasanız, 'Yemek konusunda asla sıkıntı çekmem' dersiniz?", options: ["Yöresel lezzetler tam benlik!", "Dışarıdan yemeyi severim, her şey elimin altında olsun"] },
      { question: "Bir tatilde sizi en çok heyecanlandıran şey ne olurdu?", options: ["Turist gibi gezip eğlenmek", "Güneşlenmek, biraz da yanmak", "Kar topu savaşı ya da kayak", "Yağmuru izlemek, sessiz doğa"] },
      { question: "Tatil sabahlarınız genelde nasıl başlar, güne nasıl başlamayı seversiniz?", options: ["Kahveyle uyanırım, acele etmem", "Sabahın erken saatinde dışarı fırlarım", "Önce atkımı bulurum, sonra kahvaltı", "Yağmur varsa dışarı çıkmam"] },
      { question: "Tatil akşamları geldiğinde, en çok ne yapmaktan keyif alırsınız?", options: ["Şehirde gezinmek", "Sahilde içecek keyfi", "Soba başında sohbet", "Yağmur sesiyle battaniyeye sarılmak"] },
      { question: "Bir tatil fotoğrafına baktığınızda, sizi en çok hangi manzara mutlu ederdi?", options: ["Güneş ve deniz", "Kar ve dağ manzarası", "Renkli sokaklar", "Yeşillik ve sis"] },
      { question: "Tatile çıkmak için genelde hangi zamanı tercih edersiniz?", options: ["Hafta içi daha sakin oluyor, o zamanları severim.", "Hafta sonu kaçamakları tam benlik!"] },
      { question: "Sizce bir tatilin ruhu nasıl olmalı, size en çok hangisi iyi gelir?", options: ["Enerji ve eğlence", "Doğa ve serinlik", "Kış sporu", "Deniz ve bronzluk"] },
      { question: "‘Bir sonraki tatilim kesinlikle burada olmalı’ dediğiniz ortam nasıl bir yer olurdu sizce?", options: ["Ege sahilleri", "Kayak merkezi", "Şehir, tarih ve eğlence", "Serin yaylalar"] }
    ];

    const answerMap = [
      [["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["İstanbul", "Eskişehir"], ["Trabzon"]],
      [["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["İstanbul"], ["Trabzon"]],
      [["Erzurum", "Trabzon"], ["İstanbul", "İzmir", "Antalya", "Eskişehir"]],
      [["İstanbul"], ["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["Trabzon"]],
      [["İstanbul", "Eskişehir"], ["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["Trabzon"]],
      [["İstanbul"], ["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["Trabzon"]],
      [["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["İstanbul"], ["Trabzon"]],
      [["Trabzon", "Erzurum"], ["İstanbul", "İzmir", "Antalya", "Eskişehir"]],
      [["İstanbul", "İzmir"], ["Trabzon", "Erzurum"], ["Bursa", "Erzurum"], ["İzmir", "Antalya"]],
      [["İzmir", "Antalya"], ["Bursa", "Erzurum"], ["İstanbul"], ["Trabzon"]]
    ];

    let current = 0;
    const answers = [];
    const quiz = document.getElementById("quiz");

    function showQuestion() {
      quiz.innerHTML = "";
      const q = questions[current];
      const container = document.createElement("div");
      container.className = "question-container active";
      container.innerHTML = `
        <h2 class="question">Soru ${current + 1}/${questions.length} - ${q.question}</h2>
        <div class="options">
          ${q.options.map((opt, i) => `<div class="option" data-value="${i}">${opt}</div>`).join('')}
        </div>
        <div class="navigation">
          <button id="prev" ${current === 0 ? "disabled" : ""}>◀ Geri</button>
          <button id="next" disabled>${current === questions.length - 1 ? "Testi Bitir" : "İleri ▶"}</button>
        </div>
      `;
      quiz.appendChild(container);

      const opts = container.querySelectorAll(".option");
      const next = container.querySelector("#next");

      opts.forEach((opt, index) => {
        opt.addEventListener("click", () => {
          opts.forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          answers[current] = index;
          next.disabled = false;
        });
      });

      container.querySelector("#prev").addEventListener("click", () => {
        if (current > 0) {
          current--;
          showQuestion();
        }
      });

      next.addEventListener("click", () => {
        if (current < questions.length - 1) {
          current++;
          showQuestion();
        } else {
          showResult();
        }
      });
    }

    function showResult() {
      quiz.style.display = "none";
      const cityScores = {
        "İstanbul": 0, "İzmir": 0, "Antalya": 0, "Bursa": 0, "Erzurum": 0,
        "Trabzon": 0, "Eskişehir": 0
      };

      answers.forEach((answerIndex, qIndex) => {
        const selectedCities = answerMap[qIndex][answerIndex];
        selectedCities.forEach(city => {
          if (cityScores[city] !== undefined) {
            cityScores[city]++;
          }
        });
      });

      const topCity = Object.entries(cityScores).sort((a, b) => b[1] - a[1])[0][0];
      const city = cities.find(c => c.name === topCity);

      document.getElementById("city-name").textContent = city.name;
      document.getElementById("city-description").textContent = city.desc;
      document.getElementById("city-img").src = city.img;
      document.getElementById("result").style.display = "block";
      document.getElementById("restart-btn").style.display = "inline-block";
    }

    document.getElementById("restart-btn").addEventListener("click", () => {
      current = 0;
      answers.length = 0;
      document.getElementById("result").style.display = "none";
      document.getElementById("restart-btn").style.display = "none";
      quiz.style.display = "block";
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
