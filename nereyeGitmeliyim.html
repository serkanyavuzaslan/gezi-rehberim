<!-- Güncellenmiş Mood Testi - Daha Estetik ve Açıklamalı -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Testi - Türkiye Şehir Önerisi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fff3e0;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #ffa726, #fb8c00);
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .question-container {
      display: none;
    }

    .question-container.active {
      display: block;
      background: #fff;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      animation: fadeIn 0.3s ease;
    }

    .question::before {
      content: "🧭 ";
    }

    .question {
      font-size: 1.5rem;
      margin-bottom: 25px;
      color: #e65100;
      text-align: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
    }

    .option {
      padding: 14px 18px;
      background-color: #ffe0b2;
      border: 2px solid #ffcc80;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      font-size: 1.1rem;
    }

    .option:hover,
    .option.selected {
      background-color: #ffb74d;
      border-color: #fb8c00;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    button {
      padding: 10px 24px;
      background-color: #fb8c00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:disabled {
      background-color: #ffcc80;
      cursor: not-allowed;
    }

    .result-container {
      display: none;
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.4s ease;
    }

    .result-container h2 {
      color: #e65100;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .result-container p {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #444;
    }

    .result-container img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mood Testi</h1>
      <p>Ruh haline göre Türkiye'de seni bekleyen şehri öğren!</p>
    </header>

    <div id="quiz"></div>
    <div class="result-container" id="result">
      <h2>Senin İçin En Uygun Şehir:</h2>
      <p id="city-name" style="font-weight: bold;"></p>
      <p id="city-description"></p>
      <img id="city-img" src="" alt="">
    </div>
    <button id="restart-btn" style="margin-top: 20px; display:none; padding: 10px 24px; background-color: #e65100; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;">Testi Yeniden Başlat</button>
  </div>
  <script>

        img: "https://cdn.pixabay.com/photo/2021/10/31/12/47/rize-6758310_1280.jpg"
      },
      {

        desc: "Tarihi dokusu ve balıkçı tekneleriyle huzur dolu bir Karadeniz kasabası. Deniz ürünleri ve gün batımı burada başka güzel.",
        img: "https://cdn.pixabay.com/photo/2022/06/01/15/00/amasra-7235984_1280.jpg"

    ];

    const questions = [
  { question: "Tatilde nasıl hissetmek istersin?", options: ["Dinlenmiş", "Maceralı", "İlham almış", "Huzurlu"] },
  { question: "En sevdiğin hava durumu nedir?", options: ["Sıcak ve güneşli", "Serin ve rüzgarlı", "Kapalı ve yağmurlu", "Mevsimlik değişken"] },
  { question: "Tatil süresince en çok ne yapmak istersin?", options: ["Denize girmek", "Doğa yürüyüşü", "Müze gezmek", "Gastronomi keşfi"] },
  { question: "Tatili kiminle yapmayı tercih edersin?", options: ["Ailemle", "Arkadaşlarımla", "Yalnız", "Sevgilimle"] },
  { question: "Tatil ulaşım tercihin?", options: ["Uçak", "Araba", "Otobüs", "Tren"] },
  { question: "Bir tatil fotoğrafında ne görünsün isterdin?", options: ["Plaj", "Yayla", "Tarihi bina", "Festival alanı"] },
  { question: "Tatil sırasında alışveriş yapar mısın?", options: ["Evet, bolca", "Biraz", "Nadiren", "Hiç yapmam"] },
  { question: "Tatilde yemek tercihin nedir?", options: ["Deniz ürünleri", "Et yemekleri", "Yöresel lezzetler", "Vejetaryen/vegan seçenekler"] },
  { question: "Tatilde gece hayatı önemli mi?", options: ["Evet, çok önemli", "Bazen", "Hayır", "Sabaha kadar eğlence"] },
  { question: "Doğayı mı tarihi mi tercih edersin?", options: ["Doğa", "İkisi de", "Tarih", "Modern yaşam"] },
  { question: "Sence huzur nerede bulunur?", options: ["Deniz kenarında", "Dağ başında", "Tarihi bir sokakta", "Bir köy kahvesinde"] },
  { question: "Tatilde müzik dinler misin?", options: ["Sürekli", "Ara sıra", "Hayır", "Canlı performans tercih ederim"] },
  { question: "Tatil bütçen nasıldır?", options: ["Lüks", "Orta", "Ekonomik", "En ucuz olsun"] },
  { question: "Kaldığın yer nasıl olsun?", options: ["Resort otel", "Doğa içinde bungalov", "Tarihi butik otel", "Kamp alanı"] },
  { question: "Sana göre tatil hangi mevsimde güzeldir?", options: ["Yaz", "İlkbahar", "Sonbahar", "Kış"] },
  { question: "Bir şehri ne çeker?", options: ["Plajları", "Manzarası", "Tarihi", "İnsanları"] },
  { question: "Tatilde yeni insanlarla tanışır mısın?", options: ["Evet", "Belki", "Hayır", "Sadece gerekirse"] },
  { question: "Bir tatil sana ne kazandırmalı?", options: ["Enerji", "Macera", "Bilgi", "Huzur"] },
  { question: "Tatilde telefon kullanımı?", options: ["Sürekli elimde", "Günde birkaç kez", "Sadece acil durumda", "Tamamen kapalı"] },
  { question: "Tatilden sonra hissetmek istediğin şey?", options: ["Tazelenmiş", "Heyecan dolu", "Düşünceli", "Motivasyonlu"] }
];

    let current = 0;
    const answers = [];
    const quiz = document.getElementById("quiz");

    function showQuestion() {
      quiz.innerHTML = "";
      const q = questions[current];
      const container = document.createElement("div");
      container.className = "question-container active";
      container.innerHTML = `
        <h2 class="question">Soru ${current + 1}/${questions.length} - ${q.question}</h2>
        <div class="options">
          ${q.options.map((opt, i) => `<div class="option" data-value="${i}">${opt}</div>`).join('')}
        </div>
        <div class="navigation">
          <button id="prev" ${current === 0 ? "disabled" : ""}>◀ Geri</button>
          <button id="next" disabled>${current === questions.length - 1 ? "Testi Bitir" : "İleri ▶"}</button>
        </div>
      `;
      quiz.appendChild(container);

      const opts = container.querySelectorAll(".option");
      const next = container.querySelector("#next");

      opts.forEach((opt, index) => {
        opt.addEventListener("click", () => {
          opts.forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          answers[current] = index;
          next.disabled = false;
        });
      });

      container.querySelector("#prev").addEventListener("click", () => {
        if (current > 0) {
          current--;
          showQuestion();

    document.getElementById("restart-btn").addEventListener("click", () => {
      current = 0;
      answers.length = 0;
      document.getElementById("result").style.display = "none";
      document.getElementById("restart-btn").style.display = "none";
      quiz.style.display = "block";
      showQuestion();
    });
        }
      });

      next.addEventListener("click", () => {
        if (current < questions.length - 1) {
          current++;
          showQuestion();
        } else {
          showResult();
        }
      });
    }

    function showResult() {
      quiz.style.display = "none";
      const result = answers.reduce((acc, val) => acc + val, 0);
      const city = cities[result % cities.length];
      document.getElementById("city-name").textContent = city.name;
      document.getElementById("city-description").textContent = city.desc;
      document.getElementById("city-img").src = city.img;
      document.getElementById("result").style.display = "block";
      document.getElementById("restart-btn").style.display = "inline-block";

      const questionIndex = answers.reduce((acc, val, idx) => val === Math.max(...answers) && acc === -1 ? idx : acc, -1);
      const trigger = questions[questionIndex];
      const triggerAnswer = trigger.options[answers[questionIndex]];

      
    }

    showQuestion();
  </script>
</body>
</html>
