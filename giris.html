<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap</title>

  <!-- style2.css bağlantısı -->
  <link rel="stylesheet" href="style2.css">

  <!-- FontAwesome ve Montserrat -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="container">
    <div class="image-side">
      <img src="img/giris.png" alt="Giriş Görseli">
    </div>
    <div class="form-side">
      <h2>GİRİŞ YAP</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="E-posta adresiniz" required />
        <input type="password" id="loginPassword" placeholder="Şifreniz" required />
        <button type="submit">Giriş Yap</button>
      </form>
      <p>Hesabınız yok mu? <a href="kaydol.html">Kayıt Ol</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const storedEmail = localStorage.getItem("userEmail");
      const storedPassword = localStorage.getItem("userPassword");

      if (email === storedEmail && password === storedPassword) {
        alert("Giriş başarılı!");
        window.location.href = "index.html";
      } else {
        alert("E-posta veya şifre yanlış.");
      }
    });
  </script>

</body>
</html>
